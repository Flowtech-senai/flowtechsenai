{% extends 'cliente.html' %} <!-- extensão que busca a tela 'cliente.html' e liga com esta tela -->

{% block conteudo %}

<div class="mb-4">
    <h1 class="main-title mb-3" style="color: #007E83; font-weight: 700; letter-spacing: 1px; text-align: center;">
        Gestão de Clientes</h1>
    <p class="text-muted text-center">Preencha as informações do cliente</p>
</div>

<div class="card">
    <div class="card-header" style="background-color: #007E83; padding: 10px; color:#ffffff; font-weight: bold;">
        <i class="bi bi-plus-circle me-2 --primary-color"></i> NOVO CADASTRO
    </div>
    <div class="card-body border-0">

        <form method="POST" action="{{ url_for('salvar_cliente') }}">

            <!-- card com os campos necessários para cadastrar um cliente -->
            <div class="row">

                <!-- NOME -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control" value="{{ cliente.nome if cliente else '' }}"
                        placeholder="Insira o nome do cliente" required>
                </div>

                <!-- CNPJ -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">CNPJ</label>
                    <input type="text" name="cnpj" class="form-control" value="{{ cliente.cnpj if cliente else '' }}"
                        placeholder="00.000.000/0000-00">
                </div>

                <!-- EMAIL -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="e_mail" class="form-control"
                        value="{{ cliente.e_mail if cliente else '' }}" placeholder="email@empresa.com">
                </div>

                <!-- TELEFONE -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Telefone</label>
                    <input type="text" name="telefone" class="form-control"
                        value="{{ cliente.telefone if cliente else '' }}" placeholder="(11) 99999-9999">
                </div>

                <!-- ENDEREÇO -->
                <div class="col-md-12 mb-3">
                    <label class="form-label">Endereço</label>
                    <input type="text" name="endereco" class="form-control"
                        value="{{ cliente.endereco if cliente else '' }}" placeholder="Rua, número, bairro, cidade">
                </div>

            </div>

            <!-- BOTÕES -->
            <div class="d-flex justify-content-end gap-2 mt-3">

                <a href="{{ url_for('listar_clientes') }}" class="btn btn-outline-secondary rounded-pill">
                    <i class="bi bi-arrow-left"></i> Cancelar <!-- retorna para 'lista.html' -->
                </a>

                <button type="submit" class="btn btn-outline-success px-5 rounded-pill shadow-sm fw-bold">
                    <i class="bi bi-check-lg me-2"></i>Salvar
                </button>

            </div>
        </form>
    </div>
</div>

{% endblock %}
