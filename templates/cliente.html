{% extends "base.html" %} <!-- extensão que mantém o menu lateral em todas as telas -->

{% block conteudo %}

<div class="container py-5">

    <h2 class="text-center fw-bold text-custom-green mb-5 style=color: #007E83; font-weight: 700; letter-spacing: 1px;">
        CADASTRO DE CLIENTE</h2>

    <form method="POST" action="{{ url_for('salvar_cliente') }}">
        <div class="row">


            <!-- conteúdo com os campos para cadastrar cliente -->
            <div class="col-md-9">
                <div class="tab-content card card-cadastro p-4">


                    <h5 class="fw-bold mb-4 text-custom-green">Dados Pessoais</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nome</label>
                            <input type="text" name="nome" class="form-control" placeholder="Digite o nome do cliente" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">CNPJ</label>
                            <input type="text" name="cnpj" class="form-control" placeholder="00.000.000/0001-00"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">E_mail</label>
                            <input type="email" name="e_mail" class="form-control" placeholder="exemplo@email.com"
                                required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone</label>
                            <input type="text" name="telefone" class="form-control" placeholder="(11) 99999-9999"
                                required>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Endereço</label>
                            <input type="text" name="endereco" class="form-control" placeholder="Rua e número" required>
                        </div>
                    </div>


                </div>
    </form>

    <!--  Para ver os clientes cadastrados  -->
    <h1 style="color: #007E83; font-weight: 700; letter-spacing: 1px;">Clientes Cadastrados</h1>
    <br><br>

    <table class="table">
        <tbody>
            {% if clientes %}
            {% for c in clientes %}
            <tr>
                <td>{{ c.cliente_id }}</td>
                <td>{{ c.nome }}</td>
                <td>{{ c.cnpj }}</td>
                <td>{{ c.e_mail }}</td>
                <td>
                    <form action="{{ url_for('excluir_cliente', id=c.cliente_id) }}" method="POST"
                        onsubmit="return confirm('Deseja excluir {{ c.nome }}?')">
                        <button type="submit" class="btn-excluir">Excluir</button> <!-- permite excluir clientes -->
                    </form>
                </td>
            </tr>
            {% endfor %}
            {% else %}
            <tr>
                <td colspan="5" class="text-center text-muted">Nenhum cliente cadastrado.</td>
            </tr>
            {% endif %}
        </tbody>
    </table>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function validarETab(nextTabId) {
        const stepAtual = document.querySelector('.tab-pane.active');
        const inputsObrigatorios = stepAtual.querySelectorAll('input[required]');

        // Verifica se todos os campos obrigatórios estão preenchidos
        for (let input of inputsObrigatorios) {
            if (!input.checkValidity()) {
                input.reportValidity();
                return;
            }
        }

        // Ativa a próxima aba usando Bootstrap
        const nextTabButton = document.getElementById(nextTabId);
        const tab = new bootstrap.Tab(nextTabButton);
        tab.show();
    }
</script>
{% endblock %}
