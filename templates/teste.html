<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Dashboard IoT
    </title>

    <!-- CANVASJS -->

    <script src="https://cdn.canvasjs.com/canvasjs.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f1f5f9;

            color: #0f172a;

        }


        /* =====================================
           CONTAINER
        ===================================== */

        .dashboard {

            max-width: 1400px;

            margin: auto;

            padding: 25px;

        }


        /* =====================================
           HEADER
        ===================================== */

        header {

            background: #0f172a;

            color: white;

            padding: 25px;

            border-radius: 14px;

            margin-bottom: 20px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        header h1 {

            margin: 0;

            font-size: 28px;

        }


        header p {

            margin-bottom: 0;

            color: #cbd5e1;

        }


        .status {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .status-ponto {

            width: 12px;

            height: 12px;

            border-radius: 50%;

            background: #22c55e;

        }


        .status-ponto.offline {

            background: #ef4444;

        }


        /* =====================================
           KPIs
        ===================================== */

        .kpis {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 15px;

            margin-bottom: 20px;

        }


        .kpi {

            background: white;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, .06);

        }


        .kpi-titulo {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 10px;

        }


        .kpi-valor {

            font-size: 30px;

            font-weight: bold;

        }


        .vermelho {

            color: #dc2626;

        }


        .azul {

            color: #2563eb;

        }


        .verde {

            color: #16a34a;

        }


        .laranja {

            color: #ea580c;

        }


        /* =====================================
           GRÁFICOS
        ===================================== */

        .graficos {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

            margin-bottom: 20px;

        }


        .card {

            background: white;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, .06);

        }


        .card h2 {

            margin-top: 0;

            font-size: 18px;

        }


        .grafico {

            height: 320px;

            width: 100%;

        }


        /* =====================================
           RFID
        ===================================== */

        .rfid {

            margin-bottom: 20px;

        }


        table {

            width: 100%;

            border-collapse:
                collapse;

        }


        th,
        td {

            padding: 12px;

            text-align: left;

            border-bottom:
                1px solid #e2e8f0;

        }


        th {

            background: #f8fafc;

        }


        .badge {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

        }


        .entrada {

            background: #dcfce7;

            color: #166534;

        }


        .saida {

            background: #ffedd5;

            color: #9a3412;

        }


        /* =====================================
           RESPONSIVO
        ===================================== */

        @media(max-width:1100px) {

            .kpis {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        @media(max-width:800px) {

            .graficos {

                grid-template-columns:
                    1fr;

            }


            .kpis {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media(max-width:500px) {

            .kpis {

                grid-template-columns:
                    1fr;

            }


            header {

                display: block;

            }


            .status {

                margin-top: 15px;

            }

        }
    </style>

</head>
<body>

    <div class="dashboard">

        <!-- =====================================
         HEADER
    ===================================== -->
        <header>
            <div>
                <h1>
                    Dashboard IoT
                </h1>
                <p>
                    Monitoramento ESP32
                    e controle RFID
                </p>
            </div>

            <div class="status">

                <span id="statusPonto" class="status-ponto">
                </span>

                <span id="statusTexto">
                    Conectando...
                </span>
            </div>
        </header>

        <!-- =====================================
         KPIs
    ===================================== -->

        <section class="kpis">


            <div class="kpi">

                <div class="kpi-titulo">
                    Temperatura
                </div>

                <div id="temperatura" class="kpi-valor vermelho">

                    -- °C

                </div>

            </div>


            <div class="kpi">

                <div class="kpi-titulo">
                    Umidade
                </div>

                <div id="umidade" class="kpi-valor azul">

                    -- %

                </div>

            </div>


            <div class="kpi">

                <div class="kpi-titulo">
                    Distância
                </div>

                <div id="distancia" class="kpi-valor">

                    -- cm

                </div>

            </div>


            <div class="kpi">

                <div class="kpi-titulo">
                    Leituras RFID
                </div>

                <div id="totalRFID" class="kpi-valor laranja">

                    0

                </div>

            </div>


            <div class="kpi">

                <div class="kpi-titulo">
                    Leitor RFID
                </div>

                <div id="leitorRFID" class="kpi-valor verde">

                    --

                </div>

            </div>


        </section>


        <!-- =====================================
         GRÁFICOS
    ===================================== -->

        <section class="graficos">


            <div class="card">

                <h2>
                    Temperatura
                </h2>

                <div id="graficoTemperatura" class="grafico">
                </div>

            </div>


            <div class="card">

                <h2>
                    Umidade
                </h2>

                <div id="graficoUmidade" class="grafico">
                </div>

            </div>


            <div class="card">

                <h2>
                    Distância
                </h2>

                <div id="graficoDistancia" class="grafico">
                </div>

            </div>


            <div class="card">

                <h2>
                    Movimentações RFID
                </h2>

                <div id="graficoRFID" class="grafico">
                </div>

            </div>


        </section>


        <!-- =====================================
         TABELA RFID
    ===================================== -->

        <section class="card rfid">

            <h2>
                Últimas leituras RFID
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Horário
                        </th>

                        <th>
                            Dispositivo
                        </th>

                        <th>
                            UID
                        </th>

                        <th>
                            Produto
                        </th>

                        <th>
                            Movimento
                        </th>

                    </tr>

                </thead>


                <tbody id="tabelaRFID">

                </tbody>

            </table>

        </section>


    </div>


    <script>


        // ======================================================
        // CONFIGURAÇÃO
        // ======================================================


        // Python
        const API = "http://localhost:5000/api";


        // Para testar Node.js:
        // const API = "http://localhost:3000/api";


        const INTERVALO =
            30000;


        // ======================================================
        // UTILITÁRIOS
        // ======================================================

        function formatarHora(data) {

            return new Date(data)
                .toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );

        }


        // ======================================================
        // BUSCAR RESUMO
        // ======================================================

        async function buscarResumo() {

            const resposta =
                await fetch(
                    `${API}/resumo`
                );


            const dados =
                await resposta.json();


            document.querySelector(
                "#temperatura"
            ).textContent =
                `${dados.temperatura ?? "--"} °C`;


            document.querySelector(
                "#umidade"
            ).textContent =
                `${dados.umidade ?? "--"} %`;


            document.querySelector(
                "#totalRFID"
            ).textContent =
                dados.rfid_total;


            const leitor =
                document.querySelector(
                    "#leitorRFID"
                );


            if (dados.leitor_ativo) {

                leitor.textContent =
                    "ATIVO";

                leitor.className =
                    "kpi-valor verde";

            } else {

                leitor.textContent =
                    "INATIVO";

                leitor.className =
                    "kpi-valor vermelho";

            }

        }


        // ======================================================
        // SENSOR DHT11
        // ======================================================

        async function buscarSensores() {

            const resposta =
                await fetch(
                    `${API}/sensores`
                );


            const dados =
                await resposta.json();


            if (!dados.length) {

                return;

            }


            const ultimo =
                dados[dados.length - 1];


            document.querySelector(
                "#temperatura"
            ).textContent =
                `${ultimo.temperatura} °C`;


            document.querySelector(
                "#umidade"
            ).textContent =
                `${ultimo.umidade} %`;


            const temperatura =
                dados.map(item => {

                    return {

                        label:
                            formatarHora(
                                item.timestamp
                            ),

                        y:
                            Number(
                                item.temperatura
                            )

                    };

                });


            const umidade =
                dados.map(item => {

                    return {

                        label:
                            formatarHora(
                                item.timestamp
                            ),

                        y:
                            Number(
                                item.umidade
                            )

                    };

                });


            criarGrafico(
                "graficoTemperatura",
                "Temperatura",
                "°C",
                temperatura
            );


            criarGrafico(
                "graficoUmidade",
                "Umidade",
                "%",
                umidade
            );

        }


        // ======================================================
        // DISTÂNCIA
        // ======================================================

        async function buscarDistancia() {

            const resposta =
                await fetch(
                    `${API}/distancia`
                );


            const dados =
                await resposta.json();


            if (!dados.length) {

                return;

            }


            const ultimo =
                dados[dados.length - 1];


            document.querySelector(
                "#distancia"
            ).textContent =
                `${Number(
                    ultimo.distancia
                ).toFixed(2)} cm`;


            const pontos =
                dados.map(item => {

                    return {

                        label:
                            formatarHora(
                                item.timestamp
                            ),

                        y:
                            Number(
                                item.distancia
                            )

                    };

                });


            criarGrafico(

                "graficoDistancia",

                "Distância",

                "cm",

                pontos

            );

        }


        // ======================================================
        // RFID
        // ======================================================

        async function buscarRFID() {

            const resposta =
                await fetch(
                    `${API}/rfid`
                );


            const dados =
                await resposta.json();


            const tabela =
                document.querySelector(
                    "#tabelaRFID"
                );


            tabela.innerHTML = "";


            dados
                .slice()
                .reverse()
                .forEach(item => {


                    const linha =
                        document.createElement(
                            "tr"
                        );


                    const classe =
                        item.movimento === "ENTRADA"
                            ? "entrada"
                            : "saida";


                    linha.innerHTML = `

                <td>
                    ${formatarHora(
                        item.timestamp
                    )}
                </td>

                <td>
                    ${item.device_id}
                </td>

                <td>
                    ${item.rfid_uid}
                </td>

                <td>
                    ${item.produto}
                </td>

                <td>

                    <span
                        class="badge ${classe}">

                        ${item.movimento}

                    </span>

                </td>

            `;


                    tabela.appendChild(
                        linha
                    );

                });


            // ----------------------------------------------
            // GRÁFICO RFID
            // ----------------------------------------------

            let entradas = 0;

            let saidas = 0;


            dados.forEach(item => {

                if (
                    item.movimento ===
                    "ENTRADA"
                ) {

                    entradas++;

                } else {

                    saidas++;

                }

            });


            criarGraficoRFID(
                entradas,
                saidas
            );

        }


        // ======================================================
        // GRÁFICO GENÉRICO
        // ======================================================

        function criarGrafico(
            elemento,
            titulo,
            unidade,
            dados
        ) {

            const grafico =
                new CanvasJS.Chart(
                    elemento,
                    {

                        animationEnabled: true,

                        zoomEnabled: true,

                        title: {

                            text:
                                `${titulo} ao longo do tempo`

                        },

                        axisY: {

                            title:
                                unidade

                        },

                        axisX: {

                            labelAngle:
                                -45

                        },

                        data: [

                            {

                                type:
                                    "line",

                                markerSize:
                                    5,

                                dataPoints:
                                    dados

                            }

                        ]

                    }
                );


            grafico.render();

        }


        // ======================================================
        // GRÁFICO RFID
        // ======================================================

        function criarGraficoRFID(
            entradas,
            saidas
        ) {

            const grafico =
                new CanvasJS.Chart(
                    "graficoRFID",
                    {

                        animationEnabled: true,

                        title: {

                            text:
                                "Movimentações"

                        },

                        axisY: {

                            title:
                                "Quantidade"

                        },

                        data: [

                            {

                                type:
                                    "column",

                                dataPoints: [

                                    {

                                        label:
                                            "Entradas",

                                        y:
                                            entradas

                                    },

                                    {

                                        label:
                                            "Saídas",

                                        y:
                                            saidas

                                    }

                                ]

                            }

                        ]

                    }
                );


            grafico.render();

        }


        // ======================================================
        // ATUALIZAR DASHBOARD
        // ======================================================

        async function atualizarDashboard() {

            try {

                await Promise.all([

                    buscarResumo(),

                    buscarSensores(),

                    buscarDistancia(),

                    buscarRFID()

                ]);


                document.querySelector(
                    "#statusTexto"
                ).textContent =
                    "API conectada";


                document.querySelector(
                    "#statusPonto"
                ).classList.remove(
                    "offline"
                );


            } catch (erro) {

                console.error(
                    erro
                );


                document.querySelector(
                    "#statusTexto"
                ).textContent =
                    "API offline";


                document.querySelector(
                    "#statusPonto"
                ).classList.add(
                    "offline"
                );

            }

        }


        // ======================================================
        // PRIMEIRA EXECUÇÃO
        // ======================================================

        atualizarDashboard();


        // ======================================================
        // ATUALIZAÇÃO A CADA 30 SEGUNDOS
        // ======================================================

        setInterval(

            atualizarDashboard,

            INTERVALO

        );


    </script>


</body>

</html>
